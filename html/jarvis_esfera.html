<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>J·A·R·V·I·S</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #titulo { 
      position: absolute; 
      top: 18px; 
      left: 50%; 
      transform: translateX(-50%); 
      color: rgba(100,200,255,0.4); 
      font-family: monospace; 
      font-size: 11px; 
      letter-spacing: 6px; 
      pointer-events: none; 
    }
    #estado { 
      position: absolute; 
      bottom: 18px; 
      left: 50%; 
      transform: translateX(-50%); 
      color: rgba(100,200,255,0.45); 
      font-family: monospace; 
      font-size: 11px; 
      letter-spacing: 4px; 
      pointer-events: none; 
    }
    #ws-status { 
      position: absolute; 
      top: 18px; 
      right: 18px; 
      font-family: monospace; 
      font-size: 10px; 
      letter-spacing: 2px; 
      color: rgba(255,80,80,0.6); 
    }
    #ws-status.ok { color: rgba(80,255,150,0.6); }
    #btns { 
      position: absolute; 
      bottom: 42px; 
      left: 50%; 
      transform: translateX(-50%); 
      display: flex; 
      gap: 6px; 
    }
    button { 
      padding: 5px 12px; 
      border-radius: 16px; 
      border: 1px solid rgba(100,200,255,0.2); 
      background: rgba(100,200,255,0.05); 
      color: rgba(100,200,255,0.6); 
      cursor: pointer; 
      font-size: 10px; 
      font-family: monospace; 
      letter-spacing: 1px; 
      transition: all 0.2s; 
    }
    button:hover, button.on { 
      background: rgba(100,200,255,0.15); 
      border-color: rgba(100,200,255,0.5); 
      color: rgba(100,200,255,0.9); 
    }
  </style>
</head>
<body>
  <div id="titulo">J · A · R · V · I · S</div>
  <canvas id="c"></canvas>
  <div id="ws-status">DESCONECTADO</div>
  <div id="btns">
    <button class="on" onclick="setState('idle',this)">Idle</button>
    <button onclick="setState('escuchando',this)">Escuchar</button>
    <button onclick="setState('procesando',this)">Procesar</button>
    <button onclick="setState('hablando',this)">Hablar</button>
  </div>
  <div id="estado">IDLE</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
const wrap = document.body;
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 100);
camera.position.z = 3.5;

window.addEventListener('resize', () => {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W/H;
  camera.updateProjectionMatrix();
});

const STATES = {
  idle:        { r:0.1,  g:0.45, b:1.0,  amp:0.06, speed:0.3,  pulse:0.015, label:'IDLE' },
  escuchando:  { r:0.1,  g:0.9,  b:0.5,  amp:0.12, speed:0.6,  pulse:0.04,  label:'ESCUCHANDO' },
  procesando:  { r:1.0,  g:0.65, b:0.0,  amp:0.22, speed:1.8,  pulse:0.1,   label:'PROCESANDO' },
  hablando:    { r:0.15, g:0.75, b:1.0,  amp:0.18, speed:1.1,  pulse:0.08,  label:'HABLANDO' }
};

let cur = {...STATES.idle}, tgt = {...STATES.idle};

function lerp(a,b,f){return a+(b-a)*f;}

const N = 3000;
const geo = new THREE.BufferGeometry();
const pos = new Float32Array(N*3);
const base = new Float32Array(N*3);
const phi_arr = new Float32Array(N);
const theta_arr = new Float32Array(N);
const ph = new Float32Array(N);

for(let i=0;i<N;i++){
  phi_arr[i] = Math.acos(2*Math.random()-1);
  theta_arr[i] = Math.random()*Math.PI*2;
  ph[i] = Math.random()*Math.PI*2;
  const r = 1.0;
  base[i*3]   = r*Math.sin(phi_arr[i])*Math.cos(theta_arr[i]);
  base[i*3+1] = r*Math.sin(phi_arr[i])*Math.sin(theta_arr[i]);
  base[i*3+2] = r*Math.cos(phi_arr[i]);
  pos[i*3]=base[i*3]; pos[i*3+1]=base[i*3+1]; pos[i*3+2]=base[i*3+2];
}

geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
const mat = new THREE.PointsMaterial({ size:0.018, color:0x1a90ff, transparent:true, opacity:0.85 });
const pts = new THREE.Points(geo, mat);
scene.add(pts);

const glowGeo = new THREE.SphereGeometry(1.08,32,32);
const glowMat = new THREE.MeshBasicMaterial({ color:0x1a90ff, transparent:true, opacity:0.06, side:THREE.BackSide });
const glow = new THREE.Mesh(glowGeo, glowMat);
scene.add(glow);

const coreGeo = new THREE.SphereGeometry(0.18,24,24);
const coreMat = new THREE.MeshBasicMaterial({ color:0x40c4ff, transparent:true, opacity:0.9 });
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

let t=0, ry=0;

function setState(name, btn){
  tgt = {...STATES[name]};
  document.getElementById('estado').textContent = tgt.label;
  document.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
}

function animate(){
  requestAnimationFrame(animate);
  t += 0.016;
  const f = 0.04;
  cur.r = lerp(cur.r,tgt.r,f);
  cur.g = lerp(cur.g,tgt.g,f);
  cur.b = lerp(cur.b,tgt.b,f);
  cur.amp = lerp(cur.amp,tgt.amp,f);
  cur.speed = lerp(cur.speed,tgt.speed,f);
  cur.pulse = lerp(cur.pulse,tgt.pulse,f);

  const col = new THREE.Color(cur.r,cur.g,cur.b);
  mat.color.copy(col);
  glowMat.color.copy(col);
  coreMat.color.copy(col);

  for(let i=0;i<N;i++){
    const pha = ph[i];
    const wave = Math.sin(t*cur.speed*2 + phi_arr[i]*3 + pha)*cur.amp
               + Math.sin(t*cur.speed*0.7 + theta_arr[i]*2 + pha)*cur.amp*0.5;
    const r = 1.0 + wave;
    pos[i*3]   = base[i*3]*r;
    pos[i*3+1] = base[i*3+1]*r;
    pos[i*3+2] = base[i*3+2]*r;
  }
  geo.attributes.position.needsUpdate = true;

  const ps = 1 + Math.sin(t*cur.speed*2)*cur.pulse;
  pts.scale.setScalar(ps);
  glow.scale.setScalar(ps*1.05);
  core.scale.setScalar(1 + Math.sin(t*cur.speed*3)*cur.pulse*0.5);
  mat.opacity = 0.7 + Math.sin(t*cur.speed)*0.15;

  ry += 0.004*cur.speed;
  pts.rotation.y = ry;
  pts.rotation.x = Math.sin(t*0.15)*0.08;
  glow.rotation.y = ry*0.5;

  renderer.render(scene, camera);
}
animate();

function connectWS(){
  try {
    const ws = new WebSocket('ws://localhost:8765');
    const el = document.getElementById('ws-status');
    ws.onopen = ()=>{ el.textContent='CONECTADO'; el.className='ok'; };
    ws.onclose = ()=>{ el.textContent='DESCONECTADO'; el.className=''; setTimeout(connectWS,3000); };
    ws.onmessage = e=>{
      try{
        const d = JSON.parse(e.data);
        // Manejar ambos formatos: {event, payload:{to}} o {estado}
        const s = d.estado || (d.payload && d.payload.to);
        if(s && STATES[s]) setState(s);
      }catch(err){}
    };
  }catch(err){ setTimeout(connectWS,3000); }
}
connectWS();
  </script>
</body>
</html>
